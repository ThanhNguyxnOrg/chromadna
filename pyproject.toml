[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromadna"
version = "0.1.0"
description = "Adobe Lightroom / Camera Raw Color DNA Miner, Mathematical Preset Blender, XMP Compiler & AI Agent Skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.scripts]
chromadna = "chromadna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
