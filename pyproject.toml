[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromadna"
version = "0.2.0"
description = "Adobe Lightroom / Camera Raw Color DNA Miner, XMP Compiler, 3D LUT Exporter, Agent Skill & MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
chromadna = "chromadna.cli:main"
chromadna-mcp = "chromadna.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
