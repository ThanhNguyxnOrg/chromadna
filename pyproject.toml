[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chromadna"
version = "1.0.1"
description = "Adobe Lightroom / Camera Raw Color DNA Miner, XMP Compiler, 3D LUT Exporter, Agent Skill & MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "pillow>=10.0.0,<14.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10.0.0", "build>=1.0.0,<2.0.0", "ruff>=0.8.0,<1.0.0", "mypy>=1.13.0,<2.0.0"]

[project.scripts]
chromadna = "chromadna.cli:main"
chromadna-mcp = "chromadna.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/chromadna" = ["data/color_dna_catalog.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
