# ChromaDNA community preset catalog ingestion task
# Executable automation: .github/workflows/community-presets.yml
# The workflow is manually dispatched and commits validated catalog updates as ThanhNguyxnAgent[bot].

automation:
  workflow: .github/workflows/community-presets.yml
  importer: scripts/import_community_presets.py
  trigger: workflow_dispatch
  commit_identity: ThanhNguyxnAgent[bot]

task:
  id: community-preset-catalog-ingestion
  title: Replace synthetic starter profiles with a provenance-aware community catalog
  priority: high
  language: English
  repository: ThanhNguyxnOrg/chromadna
  target_branch: main
  delivery:
    strategy: direct_commit_to_main
    pull_requests: forbidden
    publish_packages: false
    create_release: false
    change_repository_visibility: false

goals:
  - Import the complete primary community XMP preset collection into ChromaDNA's canonical Color DNA catalog.
  - Preserve original preset names, categories, source paths, source commit, licensing, and useful Adobe metadata.
  - Make imported profiles discoverable and blendable only when their semantics support blending.
  - Replace the two synthetic Starter_Pack examples only after the imported catalog passes validation.
  - Keep the original XMP files as source inputs during ingestion; do not reinterpret an XMP preset as a flat RGB palette.

primary_source:
  repository: peva3/EmulsionPresets
  url: https://github.com/peva3/EmulsionPresets
  pinned_commit: 4312c978a3331ed69f87fd47c98a9c2a3caa2d26
  license: MIT
  license_url: https://github.com/peva3/EmulsionPresets/blob/4312c978a3331ed69f87fd47c98a9c2a3caa2d26/LICENSE
  machine_catalog: https://raw.githubusercontent.com/peva3/EmulsionPresets/4312c978a3331ed69f87fd47c98a9c2a3caa2d26/presets.json
  preset_root: Presets/
  expected_catalog_count_at_pinned_commit: 451
  raw_file_url_template: https://raw.githubusercontent.com/peva3/EmulsionPresets/4312c978a3331ed69f87fd47c98a9c2a3caa2d26/{url_encoded_path}
  attribution:
    - Copyright and license notices from the upstream LICENSE must be retained.
    - Record the upstream repository URL and exact pinned commit in every imported record or a shared provenance manifest.
    - Include a third-party notices file explaining that the imported preset recipes originate from EmulsionPresets.
    - Do not imply that ChromaDNA authored the upstream presets.

secondary_sources_for_future_audit:
  - repository: haon-v2/OpenStill
    url: https://github.com/haon-v2/OpenStill
    policy: Audit each upstream component and its individual license before importing. Do not assume the whole repository has one license for every bundled LUT.
  - repository: cyberhirsch/LUTr
    url: https://github.com/cyberhirsch/LUTr
    policy: Use as a discovery and provenance index only. Follow its per-source license notes; do not scrape or redistribute entries marked as requiring additional rights review.
  - repository: Norton0924/OpenSourceLuts
    url: https://huggingface.co/Norton0924/OpenSourceLuts
    policy: Future candidate only. Preserve each LUT's original project license and attribution; do not flatten mixed licenses into one ChromaDNA license.

implementation_requirements:
  inspect_before_editing:
    - Read README.md, pyproject.toml, src/chromadna/miner.py, src/chromadna/schema.py, src/chromadna/blender.py, src/chromadna/compiler.py, src/chromadna/lut_exporter.py, tests/, and data/color_dna_catalog.json.
    - Confirm the current catalog has two Starter_Pack records and identify every hard-coded reference to their IDs.
    - Inspect the pinned upstream presets.json, LICENSE, STYLEGUIDE.md, and representative XMP files from every category.
  ingestion:
    - Download presets.json and all 451 XMP files from the pinned commit using the catalog's file paths; URL-encode each path component safely.
    - Never download from a moving main branch during the build. The pinned commit is the reproducible source.
    - Parse XMP with a namespace-aware XML parser. Do not use regex for XML.
    - Keep source metadata separate from Adobe slider values.
    - Preserve original display name, category/group, treatment, ProcessVersion, preset UUID, Look profile name/UUID, source file path, source URL, source repository, source commit, and license identifier where present.
    - Extract every supported numeric crs slider without silently dropping fractional values. Extend schema bounds and numeric types for valid Adobe parameters found in the source corpus, including newer ColorGradeHighlight*, ColorGradeShadow*, ColorGradeBalance, GrainRoughness, and other verified fields.
    - Keep tone curves for RGB and per-channel curves. Validate curve point ordering and bounds.
    - Keep exposure and white-balance fields in source metadata even if the current blend engine intentionally excludes them from cross-profile blending. Do not silently lose them.
    - Record unsupported or non-slider XMP constructs explicitly in an import report. Do not pretend that camera profiles, embedded LUTs, local masks, DCP profiles, or arbitrary Look blocks have been converted into sliders.
    - Preserve the original category and upstream tags/descriptions. Add ChromaDNA-inferred tags as supplemental metadata, not as replacements.
    - Assign stable IDs derived from a sanitized upstream slug plus a collision-safe suffix. Do not use sequential IDs that change when catalog order changes.
    - Mark utility/reset/exposure/WB-only presets and video-reference presets with an appropriate profile_kind and blendable flag. Do not blend reset presets or incompatible technical transforms as if they were creative looks.
    - Keep the catalog schema backward-compatible where possible; if a schema migration is required, version it and update every reader/writer.
  catalog_output:
    canonical_file: data/color_dna_catalog.json
    provenance_file: data/sources/THIRD_PARTY_NOTICES.md
    import_report: data/sources/emulsionpresets-import-report.json
    optional_raw_cache: data/sources/emulsionpresets/
    raw_cache_policy: Keep raw XMP files out of the runtime package unless there is a demonstrated need. The canonical catalog must retain source URLs and hashes so it can be rebuilt.
    merge_policy: Preserve upstream profiles as individual records; do not average, rename, or deduplicate distinct film stocks solely because their slider vectors are similar.
  starter_profiles:
    current_source_hint: Starter_Pack
    policy:
      - Do not delete the two synthetic starter records before the new import is complete and validated.
      - After successful import, remove or clearly segregate synthetic examples from the default community catalog.
      - Update README, SKILL, MCP examples, CLI examples, tests, and docs to use real imported stable profile IDs.
      - Keep synthetic fixtures only in tests if they are still useful; label them as synthetic test fixtures.
  importer:
    - Add a reproducible import command or script, for example scripts/import_community_catalog.py.
    - Support --source-manifest, --output, --offline-cache, --check-only, and --report options.
    - Make imports deterministic and idempotent.
    - Fail loudly on missing files, invalid XML, unexpected catalog count changes, license-file absence, or duplicate source slugs.
    - Do not silently skip malformed XMP files. Report each failure and make the command return a non-zero exit code if any required source file fails.
    - Store SHA-256 for each source XMP so later updates can detect changed upstream files.
  tests_and_quality:
    - Add fixtures for Color Negative, Black & White, Slide, Creative/Cinematic, Alternative Process, Utility, Genre, Seasonal, Geographic, Mobile, Photographer, and Video LUT Reference categories.
    - Test metadata preservation, fractional slider precision, modern color-grading fields, curves, stable IDs, license/provenance, deterministic output, and idempotent re-import.
    - Test that non-blendable records cannot be passed to the blend engine without an explicit override.
    - Test that existing CLI, MCP, XMP compiler, preview, and LUT export flows still work with imported records.
    - Run the full test suite, lint/type checks if configured, package build, CLI help, and MCP initialize/list-tools handshake where feasible.
    - Produce a report with source count, successfully parsed count, failed count, unsupported-field counts, profile-kind counts, duplicate count, and validation results.
  documentation:
    - Update README.md and the Agent Skill in English.
    - Explain that XMP presets are parametric Adobe Camera Raw settings, while .cube and Hald CLUT assets are pixel transforms and are not losslessly interchangeable.
    - Document source attribution, license, pinned upstream commit, reproducible import command, update procedure, and unsupported Adobe constructs.
    - Clearly state that ChromaDNA preview and LUT output remain approximations and are not pixel-identical Adobe Camera Raw renders.

acceptance_criteria:
  - All 451 entries listed by the pinned upstream presets.json are accounted for in the import report.
  - Every successfully imported profile has a stable ID and complete provenance.
  - No upstream XMP is silently dropped; every failed or unsupported item is reported.
  - The two synthetic Starter_Pack records are no longer the default production catalog examples after successful import.
  - The canonical catalog is deterministic and can be regenerated from the pinned source.
  - Existing ChromaDNA CLI, MCP, blending, XMP compilation, and LUT tests pass.
  - Documentation and third-party attribution are complete and in English.
  - The final changes are committed directly to main; no pull request is created.

execution_notes:
  - Do not publish to PyPI or npm.
  - Do not change repository visibility.
  - Do not commit local user photos, RAW files, or unrelated preset packs.
  - If upstream has changed since the pinned commit, finish this pinned ingestion first; propose a separate reviewed source-version update rather than silently following main.
  - Report the exact commit SHA and validation summary after the direct commit.
