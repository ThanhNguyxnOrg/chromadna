name: Bug report
description: Report a reproducible problem in ChromaDNA.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues. Do not attach private photos, RAW files, preset packs, credentials, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the impact.
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact command or MCP tool and sanitized input details.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: Remove local usernames, private file paths, tokens, and other sensitive details.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ChromaDNA version or commit
      placeholder: "0.2.1 or a commit SHA"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python and operating system
      placeholder: "Python 3.12, Windows 11"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed credentials and private data from logs.
          required: true
        - label: I am not uploading private photos, RAW files, or unlicensed presets.
          required: true
