name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install "uv==0.10.0"
          if [ -f uv.lock ]; then
            uv sync --locked --all-extras
          else
            python -m pip install -e ".[dev]"
          fi
      - name: Run tests
        shell: bash
        run: |
          if [ -f uv.lock ]; then
            PYTHONPATH=. uv run pytest -q
          else
            python -m pytest -q
          fi
      - name: Check CLI entry point
        shell: bash
        run: |
          if [ -f uv.lock ]; then
            uv run chromadna --help
          else
            chromadna --help
          fi
      - name: Check setup script syntax
        run: node --check scripts/setup.mjs
      - name: Check setup dry run
        run: node scripts/setup.mjs --all --dry-run
      - name: Import MCP server and build package
        shell: bash
        run: |
          if [ -f uv.lock ]; then
            uv run python -c "import chromadna.mcp_server"
            uv build
          else
            python -c "import chromadna.mcp_server"
            python -m build
          fi
          python scripts/smoke_test_wheel.py
