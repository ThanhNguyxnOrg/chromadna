name: Release ChromaDNA

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "plugin.json"
      - ".claude-plugin/plugin.json"
      - ".codex-plugin/plugin.json"
      - "src/chromadna/__init__.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag override (must match pyproject.toml); leave empty to use the project version"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: chromadna-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Mint repository-scoped GitHub App token
        id: app_token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@agent-v1
        with:
          profile: content
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install "uv==0.10.0"

      - name: Resolve and verify release version
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          RELEASE_TAG="${RELEASE_TAG_INPUT:-v$VERSION}"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Requested tag $RELEASE_TAG does not match project version v$VERSION."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "::notice::Release $RELEASE_TAG already exists; skipping duplicate release."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_released=false" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Preparing $RELEASE_TAG"

      - name: Stop if this version is already released
        if: steps.version.outputs.already_released == 'true'
        run: echo "Nothing to release."

      - name: Resolve dependency lock
        if: steps.version.outputs.already_released != 'true'
        run: uv lock

      - name: Install locked dependencies
        if: steps.version.outputs.already_released != 'true'
        run: uv sync --locked --all-extras

      - name: Run complete test suite
        if: steps.version.outputs.already_released != 'true'
        run: PYTHONPATH=. uv run pytest -q

      - name: Build wheel and source distribution
        if: steps.version.outputs.already_released != 'true'
        run: uv build

      - name: Verify installed wheel and bundled catalog
        if: steps.version.outputs.already_released != 'true'
        run: uv run python scripts/smoke_test_wheel.py

      - name: Commit dependency lock if it changed
        if: steps.version.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current."
          else
            BOT_ID="$(gh api users/ThanhNguyxnAgent%5Bbot%5D --jq .id)"
            git config user.name "ThanhNguyxnAgent[bot]"
            git config user.email "${BOT_ID}+ThanhNguyxnAgent[bot]@users.noreply.github.com"
            git commit -m "build(deps): add reproducible uv lockfile"
          fi
          git fetch origin main
          git rebase origin/main
          uv sync --locked --all-extras
          PYTHONPATH=. uv run pytest -q
          uv build
          uv run python scripts/smoke_test_wheel.py
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)" push origin HEAD:main

      - name: Publish GitHub Release and tag
        if: steps.version.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "ChromaDNA $RELEASE_TAG" \
            --generate-notes
